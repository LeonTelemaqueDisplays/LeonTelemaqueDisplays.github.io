<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DCUO · Power Fantasy Contract</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 380px; overflow: hidden; background: #020508; }
</style>
</head>
<body>
<svg width="540" height="380" viewBox="0 0 540 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dcuoBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#050f1a"/>
      <stop offset="100%" stop-color="#020508"/>
    </radialGradient>
    <linearGradient id="elecBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc8800"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#006644"/>
      <stop offset="100%" stop-color="#00ff99"/>
    </linearGradient>
    <filter id="elecGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- grid pattern -->
    <pattern id="grid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#00aaff" stroke-width=".3" opacity=".07"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#00aaff" stroke-width=".3" opacity=".07"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="540" height="380" fill="url(#dcuoBg)"/>
  <rect width="540" height="380" fill="url(#grid)"/>

  <!-- Top electric bar -->
  <rect width="540" height="32" fill="#030b14"/>
  <rect width="540" height="1" y="32" fill="#00aaff" opacity=".4"/>
  <rect width="4" height="32" fill="#00aaff" filter="url(#elecGlow)"/>
  <!-- Blinking status dot -->
  <circle cx="14" cy="16" r="3.5" fill="#00aaff">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="20.5" fill="#00aaff" font-size="8.5" font-family="'Courier New',monospace" letter-spacing="1.5">DC UNIVERSE ONLINE · POWER FANTASY CONTRACT · SYSTEMS POSTMORTEM</text>

  <!-- Vitals row -->
  <rect x="12" y="40" width="516" height="38" fill="#060f1a" stroke="#0d2030" stroke-width=".7" rx="1"/>
  <line x1="142" y1="40" x2="142" y2="78" stroke="#0d2030" stroke-width=".7"/>
  <line x1="272" y1="40" x2="272" y2="78" stroke="#0d2030" stroke-width=".7"/>
  <line x1="402" y1="40" x2="402" y2="78" stroke="#0d2030" stroke-width=".7"/>

  <text x="77" y="54" text-anchor="middle" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace" letter-spacing=".5">GAME LAUNCHED</text>
  <text x="77" y="70" text-anchor="middle" fill="#00aaff" font-size="18" font-weight="700" font-family="'Courier New',monospace">2011</text>

  <text x="207" y="54" text-anchor="middle" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace" letter-spacing=".5">CONTRACT BREAKS</text>
  <text x="207" y="70" text-anchor="middle" fill="#ff3344" font-size="18" font-weight="700" font-family="'Courier New',monospace">3 ACTS</text>

  <text x="337" y="54" text-anchor="middle" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace" letter-spacing=".5">RIGHT ANSWER</text>
  <text x="337" y="70" text-anchor="middle" fill="#ffd200" font-size="18" font-weight="700" font-family="'Courier New',monospace">TOO LATE</text>

  <text x="471" y="54" text-anchor="middle" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace" letter-spacing=".5">LIFESPAN</text>
  <text x="471" y="70" text-anchor="middle" fill="#00ff99" font-size="18" font-weight="700" font-family="'Courier New',monospace">15 YRS</text>

  <!-- Section divider -->
  <line x1="12" y1="86" x2="528" y2="86" stroke="#0d2030" stroke-width=".7"/>
  <text x="12" y="98" fill="#2a4055" font-size="5.5" font-family="'Courier New',monospace" letter-spacing="1.5">POWER FANTASY DELIVERY · THREE AXES · PRE vs POST BREACH</text>

  <!-- Power fantasy axes comparison -->
  <!-- BEFORE labels -->
  <text x="12" y="116" fill="#00aaff" font-size="6" font-family="'Courier New',monospace" opacity=".7">CONTRACT INTACT</text>
  <!-- Mechanical -->
  <text x="12" y="130" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">MECHANICAL</text>
  <rect x="88" y="122" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="88" y="122" width="154" height="8" fill="url(#elecBar)" rx="1" opacity=".9"/>
  <text x="248" y="130" fill="#00aaff" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">FULL</text>

  <text x="12" y="148" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">SOCIAL</text>
  <rect x="88" y="140" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="88" y="140" width="154" height="8" fill="url(#goldBar)" rx="1" opacity=".9"/>
  <text x="248" y="148" fill="#ffd200" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">FULL</text>

  <text x="12" y="166" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">TERRITORIAL</text>
  <rect x="88" y="158" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="88" y="158" width="154" height="8" fill="url(#greenBar)" rx="1" opacity=".9"/>
  <text x="248" y="166" fill="#00ff99" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">FULL</text>

  <!-- Divider between before/after -->
  <line x1="270" y1="106" x2="270" y2="175" stroke="#0d2030" stroke-width=".7"/>

  <!-- AFTER labels -->
  <text x="278" y="116" fill="#ff3344" font-size="6" font-family="'Courier New',monospace" opacity=".7">POST-BREACH</text>
  <text x="278" y="130" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">MECHANICAL</text>
  <rect x="354" y="122" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="354" y="122" width="58" height="8" fill="#cc1122" rx="1" opacity=".8"/>
  <text x="516" y="130" fill="#ff3344" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">38%</text>

  <text x="278" y="148" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">SOCIAL</text>
  <rect x="354" y="140" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="354" y="140" width="30" height="8" fill="#cc1122" rx="1" opacity=".8"/>
  <text x="516" y="148" fill="#ff3344" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">20%</text>

  <text x="278" y="166" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">TERRITORIAL</text>
  <rect x="354" y="158" width="154" height="8" fill="#060f1a" rx="1"/>
  <rect x="354" y="158" width="22" height="8" fill="#cc1122" rx="1" opacity=".8"/>
  <text x="516" y="166" fill="#ff3344" font-size="5.5" font-family="'Courier New',monospace" opacity=".8">15%</text>

  <!-- Timeline section -->
  <line x1="12" y1="182" x2="528" y2="182" stroke="#0d2030" stroke-width=".7"/>
  <text x="12" y="194" fill="#2a4055" font-size="5.5" font-family="'Courier New',monospace" letter-spacing="1.5">DECISION TIMELINE · THREE ACTS OF SUBTRACTION</text>

  <!-- Timeline bar -->
  <rect x="12" y="202" width="516" height="6" fill="#060f1a" rx="2"/>
  <!-- Timeline fill (progress through 15yr arc) -->
  <rect x="12" y="202" width="516" height="6" fill="#00aaff" rx="2" opacity=".15"/>

  <!-- Act markers on timeline -->
  <!-- Launch -->
  <circle cx="12" cy="205" r="4" fill="#00aaff" filter="url(#elecGlow)"/>
  <text x="12" y="220" text-anchor="middle" fill="#00aaff" font-size="5" font-family="'Courier New',monospace">LAUNCH</text>

  <!-- Act I -->
  <circle cx="170" cy="205" r="4" fill="#ff3344"/>
  <text x="170" y="220" text-anchor="middle" fill="#ff3344" font-size="5" font-family="'Courier New',monospace">ACT I</text>

  <!-- Act II -->
  <circle cx="300" cy="205" r="4" fill="#ff3344"/>
  <text x="300" y="220" text-anchor="middle" fill="#ff3344" font-size="5" font-family="'Courier New',monospace">ACT II</text>

  <!-- Act III -->
  <circle cx="420" cy="205" r="4" fill="#ff3344"/>
  <text x="420" y="220" text-anchor="middle" fill="#ff3344" font-size="5" font-family="'Courier New',monospace">ACT III</text>

  <!-- Right answer -->
  <circle cx="490" cy="205" r="4" fill="#00ff99"/>
  <text x="490" y="220" text-anchor="middle" fill="#00ff99" font-size="5" font-family="'Courier New',monospace">SCALING</text>

  <!-- Three principles strip -->
  <line x1="12" y1="228" x2="528" y2="228" stroke="#0d2030" stroke-width=".7"/>
  <text x="12" y="240" fill="#2a4055" font-size="5.5" font-family="'Courier New',monospace" letter-spacing="1.5">THREE PRINCIPLES · FOR STUDIOS BUILDING LIVE SERVICE IN 2026</text>

  <!-- Principle cards -->
  <!-- P1 -->
  <rect x="12" y="248" width="160" height="78" fill="#060f1a" stroke="#0d2030" stroke-width=".7" rx="1"/>
  <rect x="12" y="248" width="160" height="16" fill="rgba(0,170,255,0.08)" rx="1"/>
  <text x="92" y="260" text-anchor="middle" fill="#00aaff" font-size="6" font-family="'Courier New',monospace">PRINCIPLE 01</text>
  <text x="18" y="277" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">POWER FANTASY</text>
  <text x="18" y="289" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">IS LOAD-BEARING</text>
  <text x="18" y="303" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">The grind exists because</text>
  <text x="18" y="313" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">the payoff exists. Remove</text>
  <text x="18" y="323" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">the payoff → break deal.</text>

  <!-- P2 -->
  <rect x="180" y="248" width="160" height="78" fill="#060f1a" stroke="#0d2030" stroke-width=".7" rx="1"/>
  <rect x="180" y="248" width="160" height="16" fill="rgba(255,210,0,0.06)" rx="1"/>
  <text x="260" y="260" text-anchor="middle" fill="#ffd200" font-size="6" font-family="'Courier New',monospace">PRINCIPLE 02</text>
  <text x="186" y="277" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">SOLVE AT THE</text>
  <text x="186" y="289" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">RIGHT LEVEL</text>
  <text x="186" y="303" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">Problem lived in instance.</text>
  <text x="186" y="313" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">Solution touched everything.</text>
  <text x="186" y="323" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">Target the intervention.</text>

  <!-- P3 -->
  <rect x="348" y="248" width="180" height="78" fill="#060f1a" stroke="#0d2030" stroke-width=".7" rx="1"/>
  <rect x="348" y="248" width="180" height="16" fill="rgba(0,255,153,0.06)" rx="1"/>
  <text x="438" y="260" text-anchor="middle" fill="#00ff99" font-size="6" font-family="'Courier New',monospace">PRINCIPLE 03</text>
  <text x="354" y="277" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">MEASURE THE</text>
  <text x="354" y="289" fill="#8aaabb" font-size="6.5" font-family="'Courier New',monospace" font-weight="700">INVISIBLE</text>
  <text x="354" y="303" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">Community health. League</text>
  <text x="354" y="313" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">activity. Mentorship pipeline.</text>
  <text x="354" y="323" fill="#4a6070" font-size="5.5" font-family="'Courier New',monospace">Invisible until it's gone.</text>

  <!-- Bottom quote bar -->
  <rect x="12" y="334" width="516" height="36" fill="rgba(0,170,255,0.04)" stroke="rgba(0,170,255,0.15)" stroke-width=".7" rx="1"/>
  <rect x="12" y="334" width="3" height="36" fill="#00aaff" opacity=".5"/>
  <text x="22" y="348" fill="#8aaabb" font-size="7" font-family="'Courier New',monospace" font-style="italic">The power fantasy is the product. The contract is real.</text>
  <text x="22" y="362" fill="#4a6070" font-size="7" font-family="'Courier New',monospace" font-style="italic">The ones that remember that are the ones players never want to leave.</text>

</svg>
</body>
</html>
