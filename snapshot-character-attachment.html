<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Attachment Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 380px; overflow: hidden; background: #0a0616; }
</style>
</head>
<body>
<svg width="540" height="380" viewBox="0 0 540 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0520"/>
      <stop offset="100%" stop-color="#060310"/>
    </linearGradient>
    <!-- Layer gradients top to bottom -->
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="layer5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="380" fill="url(#purpleBg)"/>

  <!-- Subtle radial glow from center -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#7c3aed" stop-opacity=".08"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <rect width="540" height="380" fill="url(#centerGlow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r=".7" fill="#2a1040" opacity=".6"/>
  </pattern>
  <rect width="540" height="380" fill="url(#dots)"/>

  <!-- Top bar -->
  <rect width="540" height="28" fill="#080314"/>
  <rect width="540" height="1" y="28" fill="#9b6dff" opacity=".4"/>
  <rect width="4" height="28" fill="#c084fc"/>
  <text x="12" y="18" fill="#c084fc" font-size="8.5" font-family="'Courier New',monospace" letter-spacing="1.5">CHARACTER ATTACHMENT · 5-LAYER FRAMEWORK</text>

  <!-- Framework label -->
  <text x="490" y="18" text-anchor="end" fill="#6d28d9" font-size="7" font-family="'Courier New',monospace">BEHAVIOURAL ARCH.</text>

  <!-- === LAYER STACK === -->
  <!-- Layers are at y: 44, 100, 156, 212, 268 each h=46 -->

  <!-- LAYER 1: Identity Anchoring -->
  <rect x="12" y="44" width="516" height="48" fill="#1a0830" stroke="#c084fc" stroke-width=".8" rx="2"/>
  <rect x="12" y="44" width="6" height="48" fill="url(#layer1)" rx="1"/>
  <!-- Icon circle -->
  <circle cx="38" cy="68" r="14" fill="#0f0520" stroke="#c084fc" stroke-width="1"/>
  <text x="38" y="72" text-anchor="middle" fill="#c084fc" font-size="11">◈</text>
  <!-- Layer info -->
  <text x="62" y="59" fill="#c084fc" font-size="9" font-family="'Courier New',monospace" font-weight="700" letter-spacing=".5">IDENTITY ANCHORING</text>
  <text x="62" y="74" fill="#9b6dff" font-size="7.5" font-family="'Courier New',monospace">Player projects self-concept onto character. Avatar = identity proxy.</text>
  <!-- Right metrics -->
  <rect x="400" y="52" width="54" height="16" fill="#2a0a50" stroke="#c084fc" stroke-width=".5" rx="1"/>
  <text x="427" y="63.5" text-anchor="middle" fill="#c084fc" font-size="7" font-family="'Courier New',monospace">IMPACT: ██████</text>
  <text x="462" y="59" fill="#c084fc" font-size="8" font-family="'Courier New',monospace" opacity=".6">ANCHOR</text>
  <text x="462" y="73" fill="#9b6dff" font-size="7.5" font-family="'Courier New',monospace">L1 / DEEP</text>

  <!-- LAYER 2: Parasocial Engineering -->
  <rect x="12" y="98" width="516" height="48" fill="#130620" stroke="#a855f7" stroke-width=".8" rx="2"/>
  <rect x="12" y="98" width="6" height="48" fill="url(#layer2)" rx="1"/>
  <circle cx="38" cy="122" r="14" fill="#0f0520" stroke="#a855f7" stroke-width="1"/>
  <text x="38" y="126" text-anchor="middle" fill="#a855f7" font-size="11">⬡</text>
  <text x="62" y="113" fill="#a855f7" font-size="9" font-family="'Courier New',monospace" font-weight="700" letter-spacing=".5">PARASOCIAL ENGINEERING</text>
  <text x="62" y="128" fill="#9333ea" font-size="7.5" font-family="'Courier New',monospace">Voiced dialogue, unique reactions, quest-giver memory creates intimacy.</text>
  <rect x="400" y="106" width="54" height="16" fill="#200840" stroke="#a855f7" stroke-width=".5" rx="1"/>
  <text x="427" y="117.5" text-anchor="middle" fill="#a855f7" font-size="7" font-family="'Courier New',monospace">IMPACT: █████·</text>
  <text x="462" y="113" fill="#a855f7" font-size="8" font-family="'Courier New',monospace" opacity=".6">BOND</text>
  <text x="462" y="127" fill="#9333ea" font-size="7.5" font-family="'Courier New',monospace">L2 / SOCIAL</text>

  <!-- LAYER 3: Scarcity & Desire -->
  <rect x="12" y="152" width="516" height="48" fill="#0e0520" stroke="#7c3aed" stroke-width=".8" rx="2"/>
  <rect x="12" y="152" width="6" height="48" fill="url(#layer3)" rx="1"/>
  <circle cx="38" cy="176" r="14" fill="#0f0520" stroke="#7c3aed" stroke-width="1"/>
  <text x="38" y="180" text-anchor="middle" fill="#7c3aed" font-size="11">◆</text>
  <text x="62" y="167" fill="#7c3aed" font-size="9" font-family="'Courier New',monospace" font-weight="700" letter-spacing=".5">SCARCITY &amp; DESIRE</text>
  <text x="62" y="182" fill="#6d28d9" font-size="7.5" font-family="'Courier New',monospace">Limited banners, exclusive skins, time-gated story content drives urgency.</text>
  <rect x="400" y="160" width="54" height="16" fill="#180630" stroke="#7c3aed" stroke-width=".5" rx="1"/>
  <text x="427" y="171.5" text-anchor="middle" fill="#7c3aed" font-size="7" font-family="'Courier New',monospace">IMPACT: ████··</text>
  <text x="462" y="167" fill="#7c3aed" font-size="8" font-family="'Courier New',monospace" opacity=".6">DRIVE</text>
  <text x="462" y="181" fill="#6d28d9" font-size="7.5" font-family="'Courier New',monospace">L3 / URGENCY</text>

  <!-- LAYER 4: Community Amplification -->
  <rect x="12" y="206" width="516" height="48" fill="#0c041a" stroke="#5b21b6" stroke-width=".8" rx="2"/>
  <rect x="12" y="206" width="6" height="48" fill="url(#layer4)" rx="1"/>
  <circle cx="38" cy="230" r="14" fill="#0a0318" stroke="#5b21b6" stroke-width="1"/>
  <text x="38" y="234" text-anchor="middle" fill="#5b21b6" font-size="11">⬢</text>
  <text x="62" y="221" fill="#5b21b6" font-size="9" font-family="'Courier New',monospace" font-weight="700" letter-spacing=".5">COMMUNITY AMPLIFICATION</text>
  <text x="62" y="236" fill="#4c1d95" font-size="7.5" font-family="'Courier New',monospace">Fanart, lore wikis, shipping culture sustain attachment outside the game.</text>
  <rect x="400" y="214" width="54" height="16" fill="#120428" stroke="#5b21b6" stroke-width=".5" rx="1"/>
  <text x="427" y="225.5" text-anchor="middle" fill="#5b21b6" font-size="7" font-family="'Courier New',monospace">IMPACT: ███···</text>
  <text x="462" y="221" fill="#5b21b6" font-size="8" font-family="'Courier New',monospace" opacity=".6">SOCIAL</text>
  <text x="462" y="235" fill="#4c1d95" font-size="7.5" font-family="'Courier New',monospace">L4 / EXTERNAL</text>

  <!-- LAYER 5: Retention-Monetisation Fusion -->
  <rect x="12" y="260" width="516" height="48" fill="#08021a" stroke="#3b0764" stroke-width=".8" rx="2"/>
  <rect x="12" y="260" width="6" height="48" fill="url(#layer5)" rx="1"/>
  <circle cx="38" cy="284" r="14" fill="#060210" stroke="#3b0764" stroke-width="1"/>
  <text x="38" y="288" text-anchor="middle" fill="#3b0764" font-size="11">⬟</text>
  <text x="62" y="275" fill="#6d28d9" font-size="9" font-family="'Courier New',monospace" font-weight="700" letter-spacing=".5">RETENTION-MONETISATION FUSION</text>
  <text x="62" y="290" fill="#4c1d95" font-size="7.5" font-family="'Courier New',monospace">Character-gated content converts emotional investment to spend willingness.</text>
  <rect x="400" y="268" width="54" height="16" fill="#0a0220" stroke="#3b0764" stroke-width=".5" rx="1"/>
  <text x="427" y="279.5" text-anchor="middle" fill="#6d28d9" font-size="7" font-family="'Courier New',monospace">IMPACT: ██████</text>
  <text x="462" y="275" fill="#6d28d9" font-size="8" font-family="'Courier New',monospace" opacity=".6">CONVERT</text>
  <text x="462" y="289" fill="#4c1d95" font-size="7.5" font-family="'Courier New',monospace">L5 / OUTCOME</text>

  <!-- Flow arrows between layers (right edge) -->
  <text x="528" y="76" text-anchor="middle" fill="#c084fc" font-size="9" opacity=".4">↓</text>
  <text x="528" y="130" text-anchor="middle" fill="#a855f7" font-size="9" opacity=".4">↓</text>
  <text x="528" y="184" text-anchor="middle" fill="#7c3aed" font-size="9" opacity=".4">↓</text>
  <text x="528" y="238" text-anchor="middle" fill="#5b21b6" font-size="9" opacity=".4">↓</text>

  <!-- Bottom stats bar -->
  <rect x="12" y="318" width="516" height="52" fill="#0a0318" stroke="#1e1030" stroke-width=".7" rx="2"/>
  <line x1="142" y1="318" x2="142" y2="370" stroke="#1e1030" stroke-width=".7"/>
  <line x1="272" y1="318" x2="272" y2="370" stroke="#1e1030" stroke-width=".7"/>
  <line x1="402" y1="318" x2="402" y2="370" stroke="#1e1030" stroke-width=".7"/>

  <text x="77" y="335" text-anchor="middle" fill="#444" font-size="6.5" font-family="'Courier New',monospace">GAMES ANALYSED</text>
  <text x="77" y="355" text-anchor="middle" fill="#c084fc" font-size="18" font-weight="700" font-family="'Courier New',monospace">12</text>

  <text x="207" y="335" text-anchor="middle" fill="#444" font-size="6.5" font-family="'Courier New',monospace">ATTACHMENT VECTORS</text>
  <text x="207" y="355" text-anchor="middle" fill="#a855f7" font-size="18" font-weight="700" font-family="'Courier New',monospace">47</text>

  <text x="337" y="335" text-anchor="middle" fill="#444" font-size="6.5" font-family="'Courier New',monospace">MONETISATION LIFT</text>
  <text x="337" y="355" text-anchor="middle" fill="#7c3aed" font-size="18" font-weight="700" font-family="'Courier New',monospace">3.4×</text>

  <text x="461" y="335" text-anchor="middle" fill="#444" font-size="6.5" font-family="'Courier New',monospace">RETENTION DELTA</text>
  <text x="461" y="355" text-anchor="middle" fill="#5b21b6" font-size="18" font-weight="700" font-family="'Courier New',monospace">+68%</text>

</svg>
</body>
</html>
