<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Last Ride · GTA Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 540px; height: 380px; overflow: hidden; background: #0a0a0a; }
</style>
</head>
<body>
<svg width="540" height="380" viewBox="0 0 540 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="riskBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2020"/>
      <stop offset="100%" stop-color="#ff6000"/>
    </linearGradient>
    <linearGradient id="safeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="60" x2="540" y2="60" stroke="#1a0808" stroke-width="1"/>
  <line x1="0" y1="160" x2="540" y2="160" stroke="#1a0808" stroke-width="1"/>
  <line x1="0" y1="260" x2="540" y2="260" stroke="#1a0808" stroke-width="1"/>
  <line x1="180" y1="60" x2="180" y2="380" stroke="#1a0808" stroke-width="1"/>
  <line x1="360" y1="60" x2="360" y2="380" stroke="#1a0808" stroke-width="1"/>

  <!-- Top bar -->
  <rect width="540" height="28" fill="#0f0000"/>
  <rect width="540" height="1" y="28" fill="#ff2020" opacity=".4"/>
  <rect width="4" height="28" fill="#ff2020"/>
  <text x="12" y="18" fill="#ff4444" font-size="8.5" font-family="'Courier New',monospace" letter-spacing="1.5">OPERATION: LAST RIDE · GTA ONLINE · PRE-LAUNCH RETENTION</text>

  <!-- STATUS badge -->
  <rect x="454" y="7" width="76" height="14" fill="#1a0000" stroke="#ff2020" stroke-width=".7" rx="1"/>
  <circle cx="460" cy="14" r="2.5" fill="#ff2020">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="476" y="18.5" fill="#ff4444" font-size="6.5" font-family="'Courier New',monospace">LIVE RISK</text>

  <!-- === STAT CARDS === -->
  <!-- MAU Card -->
  <rect x="12" y="38" width="156" height="68" fill="#100808" stroke="#330000" stroke-width=".8" rx="2"/>
  <text x="20" y="54" fill="#555" font-size="6.5" font-family="'Courier New',monospace" letter-spacing="1">MONTHLY ACTIVE USERS</text>
  <text x="20" y="80" fill="#ff4444" font-size="28" font-weight="700" font-family="'Courier New',monospace">18.3M</text>
  <text x="20" y="96" fill="#ff2020" font-size="6.5" font-family="'Courier New',monospace" opacity=".7">▼ -12% D90 TREND</text>

  <!-- Revenue at Risk Card -->
  <rect x="180" y="38" width="156" height="68" fill="#110900" stroke="#332200" stroke-width=".8" rx="2"/>
  <text x="188" y="54" fill="#555" font-size="6.5" font-family="'Courier New',monospace" letter-spacing="1">REVENUE AT RISK</text>
  <text x="188" y="80" fill="#ff8c00" font-size="28" font-weight="700" font-family="'Courier New',monospace">$310M</text>
  <text x="188" y="96" fill="#ff8c00" font-size="6.5" font-family="'Courier New',monospace" opacity=".7">CONSOLE SEGMENT · ANNUAL</text>

  <!-- Alert Card -->
  <rect x="348" y="38" width="180" height="68" fill="#0d0d00" stroke="#2a2200" stroke-width=".8" rx="2"/>
  <text x="356" y="54" fill="#555" font-size="6.5" font-family="'Courier New',monospace" letter-spacing="1">THREAT WINDOW</text>
  <text x="356" y="78" fill="#ffd700" font-size="22" font-weight="700" font-family="'Courier New',monospace">47 DAYS</text>
  <text x="356" y="96" fill="#ffd700" font-size="6.5" font-family="'Courier New',monospace" opacity=".7">UNTIL SEQUEL LAUNCH</text>

  <!-- === SESSION RISK SCORE === -->
  <text x="12" y="128" fill="#444" font-size="6.5" font-family="'Courier New',monospace" letter-spacing="2">SESSION RISK ANALYSIS · BY SEGMENT</text>
  <line x1="12" y1="132" x2="528" y2="132" stroke="#1a1a1a" stroke-width=".7"/>

  <!-- Console Veterans row -->
  <rect x="12" y="140" width="516" height="26" fill="#160808" rx="1"/>
  <text x="20" y="156" fill="#ff4444" font-size="7.5" font-family="'Courier New',monospace">CONSOLE VETERANS</text>
  <!-- risk bar track -->
  <rect x="180" y="146" width="240" height="8" fill="#1a0000" rx="2"/>
  <!-- risk bar fill 77% -->
  <rect x="180" y="146" width="185" height="8" fill="url(#riskBar)" rx="2"/>
  <text x="428" y="155" fill="#ff4444" font-size="8" font-family="'Courier New',monospace" font-weight="700">77% CHURN RISK</text>
  <text x="430" y="165" fill="#ff2020" font-size="6" font-family="'Courier New',monospace">⚠ CRITICAL</text>

  <!-- Modders row -->
  <rect x="12" y="170" width="516" height="26" fill="#0f0a00" rx="1"/>
  <text x="20" y="186" fill="#ff8c00" font-size="7.5" font-family="'Courier New',monospace">MODDERS / EXPLOITERS</text>
  <rect x="180" y="176" width="240" height="8" fill="#1a1000" rx="2"/>
  <rect x="180" y="176" width="145" height="8" fill="#ff8c00" rx="2" opacity=".8"/>
  <text x="428" y="185" fill="#ff8c00" font-size="8" font-family="'Courier New',monospace">60% CHURN RISK</text>

  <!-- Grinders row -->
  <rect x="12" y="200" width="516" height="26" fill="#0a0e08" rx="1"/>
  <text x="20" y="216" fill="#00c853" font-size="7.5" font-family="'Courier New',monospace">PROGRESSION GRINDERS</text>
  <rect x="180" y="206" width="240" height="8" fill="#001a08" rx="2"/>
  <rect x="180" y="206" width="72" height="8" fill="url(#safeBar)" rx="2" opacity=".9"/>
  <text x="428" y="215" fill="#00c853" font-size="8" font-family="'Courier New',monospace">30% CHURN RISK</text>

  <!-- Social Crews row -->
  <rect x="12" y="230" width="516" height="26" fill="#080a10" rx="1"/>
  <text x="20" y="246" fill="#5b8fff" font-size="7.5" font-family="'Courier New',monospace">SOCIAL / CREW PLAYERS</text>
  <rect x="180" y="236" width="240" height="8" fill="#080e1a" rx="2"/>
  <rect x="180" y="236" width="43" height="8" fill="#5b8fff" rx="2" opacity=".85"/>
  <text x="428" y="245" fill="#5b8fff" font-size="8" font-family="'Courier New',monospace">18% CHURN RISK</text>

  <!-- === SEGMENTATION MATRIX === -->
  <line x1="12" y1="270" x2="528" y2="270" stroke="#1a1a1a" stroke-width=".7"/>
  <text x="12" y="282" fill="#444" font-size="6.5" font-family="'Courier New',monospace" letter-spacing="2">RETENTION INTERVENTION MATRIX</text>

  <!-- Segment boxes -->
  <!-- Console Veterans - CRITICAL -->
  <rect x="12" y="290" width="120" height="78" fill="#160000" stroke="#ff2020" stroke-width="1" rx="2"/>
  <rect x="12" y="290" width="120" height="16" fill="#ff2020" opacity=".15" rx="2"/>
  <text x="72" y="302" text-anchor="middle" fill="#ff4444" font-size="6.5" font-family="'Courier New',monospace">CONSOLE VETS</text>
  <text x="72" y="322" text-anchor="middle" fill="#ff2020" font-size="18" font-weight="700" font-family="'Courier New',monospace">77%</text>
  <text x="72" y="338" text-anchor="middle" fill="#cc0000" font-size="6" font-family="'Courier New',monospace">4.2M USERS</text>
  <text x="72" y="354" text-anchor="middle" fill="#ff4444" font-size="6" font-family="'Courier New',monospace">PRIORITY: P0</text>
  <rect x="20" y="360" width="104" height="4" fill="#ff2020" opacity=".5" rx="1"/>

  <!-- Modders - HIGH -->
  <rect x="142" y="290" width="120" height="78" fill="#120900" stroke="#ff8c00" stroke-width=".8" rx="2"/>
  <rect x="142" y="290" width="120" height="16" fill="#ff8c00" opacity=".12" rx="2"/>
  <text x="202" y="302" text-anchor="middle" fill="#ff8c00" font-size="6.5" font-family="'Courier New',monospace">MODDERS</text>
  <text x="202" y="322" text-anchor="middle" fill="#ff8c00" font-size="18" font-weight="700" font-family="'Courier New',monospace">60%</text>
  <text x="202" y="338" text-anchor="middle" fill="#cc6600" font-size="6" font-family="'Courier New',monospace">2.8M USERS</text>
  <text x="202" y="354" text-anchor="middle" fill="#ff8c00" font-size="6" font-family="'Courier New',monospace">PRIORITY: P1</text>
  <rect x="150" y="360" width="104" height="4" fill="#ff8c00" opacity=".5" rx="1"/>

  <!-- Grinders - MEDIUM -->
  <rect x="272" y="290" width="120" height="78" fill="#080e06" stroke="#00c853" stroke-width=".8" rx="2"/>
  <rect x="272" y="290" width="120" height="16" fill="#00c853" opacity=".1" rx="2"/>
  <text x="332" y="302" text-anchor="middle" fill="#00c853" font-size="6.5" font-family="'Courier New',monospace">GRINDERS</text>
  <text x="332" y="322" text-anchor="middle" fill="#00c853" font-size="18" font-weight="700" font-family="'Courier New',monospace">30%</text>
  <text x="332" y="338" text-anchor="middle" fill="#008c38" font-size="6" font-family="'Courier New',monospace">6.1M USERS</text>
  <text x="332" y="354" text-anchor="middle" fill="#00c853" font-size="6" font-family="'Courier New',monospace">PRIORITY: P2</text>
  <rect x="280" y="360" width="104" height="4" fill="#00c853" opacity=".5" rx="1"/>

  <!-- Social - LOW -->
  <rect x="402" y="290" width="126" height="78" fill="#07090e" stroke="#5b8fff" stroke-width=".8" rx="2"/>
  <rect x="402" y="290" width="126" height="16" fill="#5b8fff" opacity=".1" rx="2"/>
  <text x="465" y="302" text-anchor="middle" fill="#5b8fff" font-size="6.5" font-family="'Courier New',monospace">SOCIAL/CREW</text>
  <text x="465" y="322" text-anchor="middle" fill="#5b8fff" font-size="18" font-weight="700" font-family="'Courier New',monospace">18%</text>
  <text x="465" y="338" text-anchor="middle" fill="#3a6acc" font-size="6" font-family="'Courier New',monospace">5.2M USERS</text>
  <text x="465" y="354" text-anchor="middle" fill="#5b8fff" font-size="6" font-family="'Courier New',monospace">PRIORITY: P3</text>
  <rect x="410" y="360" width="110" height="4" fill="#5b8fff" opacity=".5" rx="1"/>

</svg>
</body>
</html>
